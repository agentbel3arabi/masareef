<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', 'Noto Sans Arabic', sans-serif;
        }
        .glass-panel {
            backdrop-filter: blur(12px);
            background: rgba(250, 248, 255, 0.8);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-dim": "#d2d9f4",
                        "surface-variant": "#dae2fd",
                        "secondary-container": "#d0e1fb",
                        "primary": "#006b2c",
                        "tertiary-fixed-dim": "#ffb2bf",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-secondary-fixed": "#0b1c30",
                        "surface-tint": "#006e2d",
                        "on-tertiary-fixed": "#3f0016",
                        "primary-container": "#00873a",
                        "on-surface": "#131b2e",
                        "on-tertiary-fixed-variant": "#8a143c",
                        "on-primary-fixed": "#002109",
                        "inverse-surface": "#283044",
                        "tertiary": "#a72d51",
                        "surface-bright": "#faf8ff",
                        "outline": "#6e7b6c",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#d3e4fe",
                        "tertiary-fixed": "#ffd9de",
                        "background": "#faf8ff",
                        "surface-container-high": "#e2e7ff",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-error-container": "#93000a",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#131b2e",
                        "secondary": "#505f76",
                        "tertiary-container": "#c74668",
                        "inverse-on-surface": "#eef0ff",
                        "on-primary-container": "#f7fff2",
                        "primary-fixed": "#7ffc97",
                        "on-secondary-container": "#54647a",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "outline-variant": "#bdcaba",
                        "on-primary": "#ffffff",
                        "surface-container": "#eaedff",
                        "on-error": "#ffffff",
                        "on-surface-variant": "#3e4a3d",
                        "on-tertiary-container": "#fffbff",
                        "surface-container-low": "#f2f3ff",
                        "primary-fixed-dim": "#62df7d",
                        "surface-container-highest": "#dae2fd",
                        "surface": "#faf8ff",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#005320",
                        "inverse-primary": "#62df7d"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>
<body class="bg-surface text-on-surface">
<!-- Background Content (Dimmed Dashboard) -->
<div class="fixed inset-0 flex overflow-hidden opacity-40 pointer-events-none scale-[0.98]">
<!-- Side Bar Placeholder -->
<aside class="w-64 bg-slate-50 border-r border-slate-100 p-8 flex flex-col gap-8 h-full">
<div class="h-8 w-32 bg-slate-200 rounded-lg"></div>
<div class="space-y-4">
<div class="h-10 bg-slate-200 rounded-xl"></div>
<div class="h-10 bg-slate-100 rounded-xl"></div>
<div class="h-10 bg-slate-100 rounded-xl"></div>
</div>
</aside>
<main class="flex-1 p-10 space-y-8 overflow-hidden">
<div class="flex justify-between items-end">
<div class="space-y-2">
<div class="h-10 w-64 bg-slate-200 rounded-xl"></div>
<div class="h-4 w-48 bg-slate-100 rounded-lg"></div>
</div>
<div class="h-12 w-40 bg-slate-200 rounded-full"></div>
</div>
<div class="grid grid-cols-3 gap-6">
<div class="h-48 bg-white rounded-3xl shadow-sm"></div>
<div class="h-48 bg-white rounded-3xl shadow-sm"></div>
<div class="h-48 bg-white rounded-3xl shadow-sm"></div>
</div>
<div class="h-96 bg-white rounded-3xl shadow-sm"></div>
</main>
</div>
<!-- Backdrop Overlay -->
<div class="fixed inset-0 bg-on-surface/20 backdrop-blur-[2px] z-40"></div>
<!-- Right Side Drawer -->
<div class="fixed right-0 top-0 h-full w-full md:w-[420px] bg-surface-container-lowest z-50 flex flex-col shadow-2xl transition-transform duration-300 ease-out translate-x-0 rounded-l-3xl border-l border-white/20">
<!-- Sheet Header -->
<div class="flex items-center justify-between px-8 pt-8 pb-4">
<h2 class="text-xl font-bold tracking-tight text-on-surface">Add Transaction</h2>
<button class="p-2 hover:bg-surface-container-low rounded-full transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
</div>
<!-- Form Body -->
<div class="flex-1 overflow-y-auto px-8 py-4 space-y-8">
<!-- Type Toggle -->
<div class="flex p-1 bg-surface-container-low rounded-2xl">
<button class="flex-1 py-3 px-4 rounded-xl text-sm font-semibold transition-all bg-error text-on-error shadow-sm">
                    Expense
                </button>
<button class="flex-1 py-3 px-4 rounded-xl text-sm font-semibold transition-all text-secondary hover:bg-surface-container-high">
                    Income
                </button>
</div>
<!-- Amount Input -->
<div class="space-y-2 text-center">
<label class="text-[0.6875rem] uppercase tracking-wider font-bold text-secondary">Amount</label>
<div class="relative flex items-center justify-center">
<input class="w-full text-center border-none bg-transparent text-[3.5rem] font-extrabold text-on-surface focus:ring-0 placeholder:text-surface-dim" placeholder="0.00" type="text"/>
<span class="absolute right-0 top-1/2 -translate-y-1/2 bg-surface-container-high px-3 py-1 rounded-lg text-xs font-bold text-on-surface-variant">EGP</span>
</div>
</div>
<div class="space-y-6">
<!-- Account Selector -->
<div class="space-y-1.5">
<label class="text-[0.6875rem] uppercase tracking-wider font-bold text-secondary ml-1">Account</label>
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-2xl hover:bg-surface-container-high transition-colors cursor-pointer border border-transparent hover:border-outline-variant/20">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-container">account_balance</span>
</div>
<div>
<p class="text-sm font-semibold text-on-surface">CIB Savings</p>
<p class="text-xs text-secondary">235,000 EGP available</p>
</div>
</div>
<span class="material-symbols-outlined text-secondary">expand_more</span>
</div>
</div>
<!-- Date Picker -->
<div class="space-y-1.5">
<label class="text-[0.6875rem] uppercase tracking-wider font-bold text-secondary ml-1">Date</label>
<div class="flex items-center gap-3 p-4 bg-surface-container-low rounded-2xl border border-transparent focus-within:bg-white focus-within:ring-2 focus-within:ring-primary-container/20 transition-all">
<span class="material-symbols-outlined text-secondary">calendar_today</span>
<input class="bg-transparent border-none p-0 text-sm font-medium text-on-surface focus:ring-0 w-full" type="text" value="23/03/2026"/>
</div>
</div>
<!-- Description & AI Suggestion -->
<div class="space-y-1.5">
<label class="text-[0.6875rem] uppercase tracking-wider font-bold text-secondary ml-1">Description</label>
<div class="p-4 bg-surface-container-low rounded-2xl border border-transparent focus-within:bg-white focus-within:ring-2 focus-within:ring-primary-container/20 transition-all">
<input class="bg-transparent border-none p-0 text-sm font-medium text-on-surface focus:ring-0 w-full" placeholder="What was this for?" type="text"/>
</div>
<div class="flex items-center gap-2 mt-2 px-1">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
<p class="text-[11px] font-medium text-primary">Suggested category: <span class="font-bold">Groceries</span></p>
</div>
</div>
<!-- Category Selector -->
<div class="space-y-3">
<label class="text-[0.6875rem] uppercase tracking-wider font-bold text-secondary ml-1">Category</label>
<div class="grid grid-cols-3 gap-2">
<button class="flex flex-col items-center justify-center p-3 rounded-2xl bg-surface-container-low hover:bg-surface-container-high transition-all gap-1.5">
<span class="material-symbols-outlined text-secondary text-[20px]">restaurant</span>
<span class="text-[10px] font-semibold text-secondary">Food &amp; Dining</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-2xl border-2 border-primary-container bg-primary-container/5 shadow-sm transition-all gap-1.5 relative">
<div class="absolute top-1 right-1">
<span class="material-symbols-outlined text-primary text-[14px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">shopping_basket</span>
<span class="text-[10px] font-bold text-on-primary-container">Groceries</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-2xl bg-surface-container-low hover:bg-surface-container-high transition-all gap-1.5">
<span class="material-symbols-outlined text-secondary text-[20px]">commute</span>
<span class="text-[10px] font-semibold text-secondary text-center">Transport</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-2xl bg-surface-container-low hover:bg-surface-container-high transition-all gap-1.5">
<span class="material-symbols-outlined text-secondary text-[20px]">bolt</span>
<span class="text-[10px] font-semibold text-secondary">Utilities</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-2xl bg-surface-container-low hover:bg-surface-container-high transition-all gap-1.5">
<span class="material-symbols-outlined text-secondary text-[20px]">shopping_bag</span>
<span class="text-[10px] font-semibold text-secondary">Shopping</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-2xl bg-surface-container-low hover:bg-surface-container-high transition-all gap-1.5">
<span class="material-symbols-outlined text-secondary text-[20px]">school</span>
<span class="text-[10px] font-semibold text-secondary">Education</span>
</button>
</div>
</div>
<!-- More Options Collapsible -->
<button class="w-full flex items-center justify-center gap-2 py-3 text-secondary-fixed-dim hover:text-on-secondary-fixed transition-colors">
<span class="text-xs font-bold uppercase tracking-widest">More Options</span>
<span class="material-symbols-outlined text-[18px]">expand_more</span>
</button>
</div>
</div>
<!-- Sticky Footer -->
<div class="p-8 border-t border-surface-container flex gap-4 bg-surface-container-lowest/80 backdrop-blur-md rounded-bl-3xl">
<button class="flex-1 py-4 text-sm font-bold text-on-surface-variant hover:bg-surface-container-low rounded-2xl transition-all">
                Cancel
            </button>
<button class="flex-[2] py-4 text-sm font-bold text-white bg-gradient-to-br from-primary to-primary-container rounded-2xl shadow-lg shadow-primary-container/20 active:scale-[0.98] transition-all">
                Save Transaction
            </button>
</div>
</div>
<!-- Additional Decorative Floating Insight (Signature Component) -->
<div class="fixed left-10 bottom-10 w-80 z-30 pointer-events-none opacity-80 hidden lg:block">
<div class="bg-tertiary-container text-on-tertiary-container p-6 rounded-[2rem] shadow-2xl relative overflow-hidden">
<div class="relative z-10 space-y-3">
<span class="material-symbols-outlined bg-white/20 p-2 rounded-xl">insights</span>
<h3 class="font-bold text-lg leading-tight">Saving Tip</h3>
<p class="text-sm opacity-90 leading-relaxed">Your groceries spending is 12% higher than last month. Consider checking for active coupons in your bank app.</p>
</div>
<div class="absolute -right-4 -top-4 w-24 h-24 bg-white/10 rounded-full blur-2xl"></div>
</div>
</div>
</body></html>
