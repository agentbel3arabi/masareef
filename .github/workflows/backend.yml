name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Run tests
        run: uv run pytest -v --tb=short --ignore=tests/integration --cov=app --cov-report=term --cov-fail-under=50
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SUPABASE_JWT_SECRET: placeholder
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      # Local Supabase stack (Postgres + GoTrue auth + Kong) replaces the
      # old hosted-project secrets. Only auth and db are needed.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        working-directory: .
        run: supabase start -x realtime,storage-api,imgproxy,inbucket,postgrest,edge-runtime,logflare,vector,supavisor,studio,postgres-meta

      - name: Export local Supabase env
        working-directory: .
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET"
            echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:54322/postgres"
            echo "APP_ENV=testing"
          } >> "$GITHUB_ENV"

      - name: Run migrations
        run: uv run alembic upgrade head

      # seed_categories() no-ops after the migration's two predefined rows, so
      # reuse the by-name inserter from the demo seeder to reach the 18 the tests expect.
      - name: Seed predefined categories
        run: |
          uv run python -c "
          import asyncio
          from app.database import async_session_factory
          from scripts.seed_demo import seed_predefined_categories

          async def main():
              async with async_session_factory() as session, session.begin():
                  await seed_predefined_categories(session)

          asyncio.run(main())
          "

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v --tb=short
