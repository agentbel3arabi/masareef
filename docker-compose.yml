services:
  masareef-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    networks:
      - dokploy-network
      - masareef

  masareef-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - HOSTNAME=0.0.0.0
    env_file: .env
    networks:
      - dokploy-network
      - masareef
    depends_on:
      - masareef-api

networks:
  dokploy-network:
    external: true
  masareef:
    driver: bridge
