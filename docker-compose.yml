services:
  masareef-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: masareef-api
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    networks:
      - masareef

  masareef-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: masareef-web
    restart: unless-stopped
    env_file: ./frontend/.env
    ports:
      - "3001:3000"
    depends_on:
      - masareef-api
    networks:
      - masareef

networks:
  masareef:
    driver: bridge
