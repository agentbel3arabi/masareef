services:
  masareef-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: masareef-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    networks:
      - masareef

  masareef-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: masareef-web
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file: .env
    depends_on:
      - masareef-api
    networks:
      - masareef

networks:
  masareef:
    driver: bridge
