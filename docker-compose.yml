services:
  masareef-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: masareef-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${{project.SUPABASE_URL}}
      - SUPABASE_ANON_KEY=${{project.SUPABASE_ANON_KEY}}
      - SUPABASE_SERVICE_ROLE_KEY=${{project.SUPABASE_SERVICE_ROLE_KEY}}
      - SUPABASE_JWT_SECRET=${{project.SUPABASE_JWT_SECRET}}
      - DATABASE_URL=${{project.DATABASE_URL}}
      - DIRECT_DATABASE_URL=${{project.DIRECT_DATABASE_URL}}
    networks:
      - masareef

  masareef-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${{project.NEXT_PUBLIC_SUPABASE_URL}}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${{project.NEXT_PUBLIC_SUPABASE_ANON_KEY}}
        - NEXT_PUBLIC_API_URL=${{project.NEXT_PUBLIC_API_URL}}
    container_name: masareef-web
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${{project.NEXT_PUBLIC_SUPABASE_URL}}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${{project.NEXT_PUBLIC_SUPABASE_ANON_KEY}}
      - NEXT_PUBLIC_API_URL=${{project.NEXT_PUBLIC_API_URL}}
      - NODE_ENV=${{project.NODE_ENV}}
    depends_on:
      - masareef-api
    networks:
      - masareef

networks:
  masareef:
    driver: bridge
